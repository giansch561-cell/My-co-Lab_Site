{% load static %}
<!doctype html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}My-co-Lab{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'editorial/site.css' %}">
</head>
<body>
    <a class="saltar" href="#conteudo">Ir para o conteúdo</a>
    <header class="cabecalho">
        <div class="largura cabecalho-interno">
            <a class="marca" href="{% url 'editorial:inicio' %}">
                <svg class="simbolo" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
                    <circle cx="24" cy="24" r="22"/>
                    <path d="M10.5 22.5c1.8-5 7.5-10 13.5-10s11.7 5 13.5 10c-2.4 3.4-24.6 3.4-27 0Z"/>
                    <path d="M10.5 22.5c8.1-2.4 18.9-2.4 27 0M21.8 24.5c0 4.3-.8 7.8-1.6 10.1-.5 1.7 2.7 2.5 3.8 2.5s4.3-.8 3.8-2.5c-.8-2.3-1.6-5.8-1.6-10.1"/>
                </svg>
                <span>My-co-Lab</span>
            </a>
            <nav class="menu-computador" aria-label="Menu principal">
                {% include 'editorial/menu.html' %}
            </nav>
            <details class="menu-telemovel">
                <summary>Menu</summary>
                <nav aria-label="Menu principal">
                    {% include 'editorial/menu.html' %}
                </nav>
            </details>
        </div>
    </header>
    <main class="largura corpo" id="conteudo" tabindex="-1">
        {% block conteudo %}{% endblock %}
    </main>
    <footer class="rodape">
        <div class="largura rodape-interno">
            <span>My-co-Lab</span>
            <a href="{% url 'editorial:bibliografia' %}"{% if secao == 'bibliografia' %} aria-current="page"{% endif %}>Bibliografia</a>
        </div>
    </footer>
</body>
</html>
